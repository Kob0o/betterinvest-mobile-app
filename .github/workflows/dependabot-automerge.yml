name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    name: dependabot-automerge
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      # Intentionally no checkout of the PR head — pull_request_target runs with
      # base-branch privileges; only Dependabot metadata is used.
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge for patch and minor updates
        if: contains(fromJSON('["version-update:semver-patch","version-update:semver-minor"]'), steps.metadata.outputs.update-type)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Comment that major updates need manual review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR_URL" --body "$(cat <<'EOF'
          This Dependabot PR includes a **semver-major** update and needs manual review before merging.

          (Grouped PRs report the highest update-type in the group, so a group that contains a major bump is also left for manual review.)
          EOF
          )"
